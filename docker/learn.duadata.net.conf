# DataLab by DUA Edu — learn.duadata.net
server {
    listen 80;
    server_name learn.duadata.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://learn.duadata.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name learn.duadata.net;
    ssl_certificate /etc/letsencrypt/live/learn.duadata.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.duadata.net/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $datalab_backend dua-datalab:8080;
        proxy_pass http://$datalab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
